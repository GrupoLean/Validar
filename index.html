<style>
  :root{
    color-scheme: light only;
    --navy:#14284B; --navy-2:#0B1A33; --orange:#F0A020;
    --bg:#EEF2F7; --card:#FFFFFF; --text:#1A2433; --muted:#5B6878;
    --blue-bg:#DCE9FB; --blue:#1E4FB8;
    --violet-bg:#F1E6FC; --violet:#6B21A8;
    --green-bg:#DDF7E6; --green:#15803D;
    --amber-bg:#FDF0D5; --amber:#A16207;
    --red-bg:#FDE2E2; --red:#B91C1C;
    --panel:#F7F8FA;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
  header{background:#fff;padding:22px 16px 18px;display:flex;justify-content:center;border-bottom:5px solid var(--orange)}
  .logo{height:170px;width:auto;display:block}
  .hero{background:linear-gradient(160deg,var(--navy) 0%,var(--navy-2) 100%);height:150px;text-align:center;padding-top:20px}
  .hero span{color:#fff;font-size:12px;font-weight:600;letter-spacing:3px;text-transform:uppercase;opacity:.85}
  main{max-width:560px;margin:-95px auto 40px;padding:0 16px}
  .card{background:var(--card);border-radius:14px;box-shadow:0 10px 30px rgba(15,38,64,.15);padding:32px 24px;text-align:center}
  h1{font-size:28px;line-height:1.2;font-weight:800;margin-bottom:12px}
  .sub{color:var(--muted);font-size:16px;line-height:1.5;margin-bottom:26px}
  .pill{display:inline-flex;align-items:center;gap:10px;padding:12px 24px;border-radius:999px;font-weight:700;font-size:17px;margin:6px 0}
  .pill svg{width:24px;height:24px;flex:none}
  .p-date{background:var(--blue-bg);color:var(--blue)}
  .p-time{background:var(--violet-bg);color:var(--violet)}
  .p-ok{background:var(--green-bg);color:var(--green)}
  .p-warn{background:var(--amber-bg);color:var(--amber)}
  .p-bad{background:var(--red-bg);color:var(--red)}
  .pills{display:flex;flex-direction:column;align-items:center;margin-bottom:24px}
  .details{background:var(--panel);border-radius:12px;padding:6px 18px;text-align:left;margin-bottom:18px}
  .row{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid #E3E7EE;font-size:15px}
  .row:last-child{border-bottom:none}
  .row span{color:var(--muted);white-space:nowrap}
  .row b{text-align:right}
  .row.total b{color:var(--navy);font-size:17px}
  .pdfbox{background:var(--panel);border-radius:12px;padding:22px 18px}
  .pdfbox p{color:var(--muted);margin-bottom:16px}
  .btn{border:0;cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:15px;border-radius:10px;color:#fff;text-decoration:none;font-weight:700;font-size:17px;margin-top:10px}
  .btn svg{width:22px;height:22px}
  .b-open{background:#3B82F6}.b-dl{background:#22C55E}
  .note{font-size:13px;color:var(--muted);margin-top:18px;line-height:1.5}
  footer{text-align:center;font-size:12px;color:var(--muted);padding:0 16px 30px;line-height:1.6}
  .hidden{display:none}
  /* evidencia fotográfica */
  .fotos{background:var(--panel);border-radius:12px;padding:16px 18px;text-align:left;margin-bottom:18px}
  .fotos h3{font-size:15px;color:var(--navy);margin-bottom:10px}
  .f-fila{padding:9px 0;border-bottom:1px solid #E3E7EE}.f-fila:last-child{border-bottom:none}
  .f-fila p{font-size:14px;margin-bottom:6px}.f-fila a{display:inline-block;margin:0 8px 4px 0;font-weight:700;color:var(--blue);text-decoration:underline;cursor:pointer;font-size:14px}
  /* documentos anexos */
  .d-it{display:flex;align-items:center;gap:8px;width:100%;margin:0 0 6px;padding:9px 12px;background:#fff;border:1px solid #D5DBE5;border-radius:10px;font:inherit;font-size:14px;font-weight:600;color:var(--navy);text-align:left;cursor:pointer}
  .d-it span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.d-it small{color:var(--muted);font-weight:500;flex:none}
  .d-it:hover{border-color:var(--blue)}.f-fila.marca{background:#FFF8E8;border-radius:8px;padding-left:8px;padding-right:8px}
  #galeria{position:fixed;inset:0;z-index:50;background:#0B1A33;color:#fff;display:flex;flex-direction:column}
  #galeria.hidden{display:none}
  .g-top{display:flex;align-items:center;gap:12px;padding:14px 16px;padding-top:calc(14px + env(safe-area-inset-top))}
  .g-top b{font-size:16px;flex:1;min-width:0}.g-top small{display:block;font-weight:500;opacity:.75;font-size:13px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .g-btn{background:rgba(255,255,255,.14);color:#fff;border:0;border-radius:10px;padding:10px 14px;font:inherit;font-weight:700;cursor:pointer}
  .g-vista{flex:1;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;touch-action:pan-y}
  .g-vista img{max-width:100%;max-height:100%;object-fit:contain;user-select:none;-webkit-user-drag:none;transition:opacity .25s}
  .g-nav{position:absolute;top:50%;transform:translateY(-50%);width:46px;height:46px;border-radius:50%;border:0;background:rgba(255,255,255,.18);color:#fff;font-size:24px;cursor:pointer}
  .g-prev{left:10px}.g-next{right:10px}
  .g-pie{padding:10px 12px calc(14px + env(safe-area-inset-bottom));text-align:center}
  .g-cont{font-size:14px;font-weight:700;margin-bottom:8px}
  .g-miniaturas{display:flex;gap:8px;justify-content:center;overflow-x:auto;padding-bottom:4px}
  .g-miniaturas img{width:58px;height:44px;object-fit:cover;border-radius:6px;opacity:.55;cursor:pointer;border:2px solid transparent;flex:none}
  .g-miniaturas img.on{opacity:1;border-color:var(--orange)}
  .g-carga{opacity:.8;font-size:15px}
</style>
</head>

    <h1 id="titulo">Validación de Documentos</h1>
    <p class="sub" id="subtitulo">Esta pantalla verifica la autenticidad de los documentos emitidos por Grupo Σ LEAN.</p>

    <div class="pills">
      <div class="pill p-date">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
        <span id="hoy"></span>
      </div>
      <div class="pill p-time">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
        <span id="hora"></span>
      </div>
      <div class="pill" id="estado"></div>
    </div>

    <div id="contenido"></div>
  </div>
</main>

<footer id="pie"></footer>
<div id="galeria" class="hidden" role="dialog" aria-label="Evidencia fotográfica">
  <div class="g-top"><button class="g-btn" id="g-cerrar">← Volver</button><b id="g-tit">Evidencia fotográfica<small id="g-sub"></small></b><a class="g-btn" id="g-bajar" download>Descargar</a></div>
  <div class="g-vista" id="g-vista"><span class="g-carga" id="g-carga">Cargando foto…</span><img id="g-img" alt=""><button class="g-nav g-prev" id="g-prev" aria-label="Anterior">‹</button><button class="g-nav g-next" id="g-next" aria-label="Siguiente">›</button></div>
  <div class="g-pie"><div class="g-cont" id="g-cont"></div><div class="g-miniaturas" id="g-min"></div></div>
</div>

<script>
const TZ = "America/Panama";
const ICON_OK  = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.1V12a10 10 0 1 1-5.9-9.1"/><path d="M22 4 12 14l-3-3"/></svg>';
const ICON_WARN= '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>';
const ICON_BAD = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="m15 9-6 6M9 9l6 6"/></svg>';

const fmtFecha = d => new Intl.DateTimeFormat("es-PA",{day:"numeric",month:"long",year:"numeric",timeZone:TZ}).format(d);
const fmtISO = s => fmtFecha(new Date(s+"T12:00:00-05:00"));
const money = n => "$" + n.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function reloj(){
  const now = new Date();
  document.getElementById("hoy").textContent = fmtFecha(now);
  document.getElementById("hora").textContent =
    new Intl.DateTimeFormat("es-PA",{hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:true,timeZone:TZ}).format(now);
}
reloj(); setInterval(reloj,1000);

document.getElementById("pie").innerHTML = esc(EMPRESA.nombre)+"<br>"+esc(EMPRESA.contacto)+"<br>"+esc(EMPRESA.direccion);

const codigo = (new URLSearchParams(location.search).get("c")||"").trim().toUpperCase();
const estado = document.getElementById("estado");
const cont = document.getElementById("contenido");
function setEstado(cls, icon, txt){ estado.className="pill "+cls; estado.innerHTML=icon+"<span>"+txt+"</span>"; }
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

async function claves(c){
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(c), "PBKDF2", false, ["deriveBits"]);
  const bits = new Uint8Array(await crypto.subtle.deriveBits(
    {name:"PBKDF2", hash:"SHA-256", salt:new TextEncoder().encode("grupolean-validar-v1"), iterations:200000}, base, 384));
  const id = [...bits.slice(0,16)].map(b=>b.toString(16).padStart(2,"0")).join("");
  const key = await crypto.subtle.importKey("raw", bits.slice(16), "AES-GCM", false, ["decrypt"]);
  return {id, key};
}
const descifrar = (key, iv, ct) => crypto.subtle.decrypt({name:"AES-GCM", iv}, key, ct);

function noEncontrado(){
  setEstado("p-bad", ICON_BAD, codigo ? "Documento no encontrado" : "Sin código de validación");
  cont.innerHTML = '<p class="note">'+(codigo
    ? "El código <b>"+esc(codigo)+"</b> no corresponde a ningún documento emitido por Grupo Σ LEAN. Si recibió este documento, comuníquese con nosotros para confirmarlo."
    : "Escanee el código QR que aparece en su cotización, recibo o informe para verificar su autenticidad.")+"</p>";
}

function mostrar(doc, k){
  document.getElementById("titulo").textContent = "Validación de " + doc.tipo;
  // Recibos y facturas: «recibo oficial» por ahora (sin RUC aún). Cuando haya RUC, la Factura podrá decir «de la factura oficial emitida».
  const inf = doc.tipo === "Informe técnico", ec = doc.tipo === "Estado de cuenta";
  const art = doc.tipo === "Cotización" ? "de la cotización oficial emitida" : inf ? "del informe técnico oficial emitido" : ec ? "del estado de cuenta emitido" : "del recibo oficial emitido";
  document.getElementById("subtitulo").textContent = "Esta pantalla verifica la autenticidad " + art + " por Grupo Σ LEAN.";
  let filas = [["N° de documento", doc.numero],["Cliente", doc.cliente]];
  if(inf){   // informe técnico: sin montos
    if(doc.elaborado) filas.push(["Elaborado por", doc.elaborado]);
    if(doc.fechaVisita) filas.push(["Fecha de visita", fmtISO(doc.fechaVisita)]);
    if(doc.asunto) filas.push(["Asunto", doc.asunto]);
  }
  if(doc.ruc) filas.push(["CIP/RUC", doc.ruc]);
  if(doc.cotizacion) filas.push(["Cotización N.º", doc.cotizacion]);
  if(doc.descripcion) filas.push(["Concepto", doc.descripcion]);
  if(ec){   // estado de cuenta: solo lo esencial
    filas.push(["Fecha de corte", fmtISO(doc.fecha)]);
    if(doc.periodo) filas.push(["Período", doc.periodo]);
    filas.push(["Documentos incluidos", String(doc.documentos||0)], ["Total facturado", money(doc.facturado||0)], ["Total cobrado", money(doc.cobrado||0)]);
  } else filas.push([inf ? "Fecha de publicación" : "Fecha de emisión", fmtISO(doc.fecha)]);
  if(inf || ec) setEstado("p-ok", ICON_OK, "Documento Verificado");
  else if(doc.tipo === "Cotización"){
    if(doc.validoHasta) filas.push(["Válida hasta", fmtISO(doc.validoHasta)]);
    if(doc.validoHasta && new Date() > new Date(doc.validoHasta+"T23:59:59-05:00")) setEstado("p-warn", ICON_WARN, "Auténtica · Vencida");
    else setEstado("p-ok", ICON_OK, "Documento Verificado");
  } else {
    if(doc.vence) filas.push(["Fecha de vencimiento", fmtISO(doc.vence)]);
    if(doc.estado) filas.push(["Estado de pago", doc.estado]);
    setEstado("p-ok", ICON_OK, "Documento Verificado");
  }
  if(doc.anulado){   // documento anulado por Grupo LEAN
    setEstado("p-bad", ICON_BAD, "Documento anulado");
    filas.push(["Anulado el", fmtISO(doc.anulado.fecha)]);
    if(doc.anulado.motivo) filas.push(["Motivo", doc.anulado.motivo]);
  }
  const opc = Array.isArray(doc.opciones) && doc.opciones.length > 1;   // cotización con opción A / B
  if(opc){ filas.push(["Opciones cotizadas", String(doc.opciones.length)]);
    doc.opciones.forEach(o => filas.push(["Opción " + o.letra + " · " + (o.titulo||"") + (doc.aprobada===o.letra ? " ✓ aprobada" : ""), money(o.total)])); }
  else (doc.desglose||[]).forEach(([a,v]) => filas.push([a, money(v)]));
  let html = '<div class="details">' +
    filas.map(([a,v]) => '<div class="row"><span>'+esc(a)+'</span><b>'+esc(v)+'</b></div>').join("") +
    (inf || (opc && !doc.aprobada) ? '' : '<div class="row total"><span>'+(ec ? 'Saldo pendiente' : opc ? 'Total (opción ' + esc(doc.aprobada) + ')' : 'Total')+'</span><b>'+money(doc.total)+'</b></div>') +
    (opc && !doc.aprobada ? '<p class="note" style="margin:8px 0 0">Esta cotización presenta varias opciones para el mismo trabajo: se paga solo la opción elegida.</p>' : '') +
    (doc.saldo!=null ? '<div class="row"><span>Saldo pendiente</span><b>'+money(doc.saldo)+'</b></div>' : '') + '</div>';
  if(doc.anulado) html += '<p class="note" style="color:#b91c1c;font-weight:700">Este documento fue anulado por Grupo Σ LEAN y no tiene validez.</p>';
  if(doc.pdf && !doc.anulado){
    html += '<div class="pdfbox"><p>El documento PDF está listo para ser visualizado</p>' +
      '<button class="btn b-open" id="abrir"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6M15 3h6v6M10 14 21 3"/></svg>Abrir PDF</button>' +
      '<button class="btn b-dl" id="bajar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>Descargar</button></div>';
  }
  if(doc.fotos && doc.fotos.length && !doc.anulado){
    html += '<div class="fotos"><h3>Evidencia fotográfica</h3>' + doc.fotos.map(f => '<div class="f-fila"><p><b>'+esc(f.etq || ('Fila '+f.fila))+':</b> '+esc(f.desc||"")+'</p>' +
      f.ids.map((id,j) => '<a data-f="'+f.fila+'" data-i="'+(j+1)+'">img'+String(j+1).padStart(2,"0")+'</a>').join("") + '</div>').join("") + '</div>';
  }
  if(doc.docs && doc.docs.length && !doc.anulado){
    const ico = n => /\.pdf$/i.test(n) ? "📄" : /\.(xlsx?|csv)$/i.test(n) ? "📊" : "📝";
    const peso = b => !b ? "" : b >= 1048576 ? (b/1048576).toFixed(1) + " MB" : Math.max(1, Math.round(b/1024)) + " KB";
    html += '<div class="fotos" id="docs"><h3>Anexos</h3>' + doc.docs.map(f => '<div class="f-fila" data-fila="'+f.fila+'"><p><b>'+esc(f.etq || ('Fila '+f.fila))+':</b> '+esc(f.desc||"")+'</p>' +
      f.archivos.map((x,j) => '<button class="d-it" data-f="'+f.fila+'" data-j="'+j+'">'+ico(x.nombre)+' <span>'+esc(x.nombre)+'</span><small>'+peso(x.tam)+'</small></button>').join("") + '</div>').join("") + '</div>';
  }
  if(doc.reporte && doc.reporte.length && !doc.anulado){   // reporte o propuesta que acompaña a la cotización
    const nR = doc.reporte.length;
    html += '<div class="fotos" id="rep"><p style="font-size:15px;margin:0"><b style="color:var(--navy)">Reporte anexado:</b> <a id="rep-link" style="font-weight:700;color:var(--blue);text-decoration:underline;cursor:pointer">' + nR + (nR===1 ? " archivo" : " archivos") + '</a></p>' +
      '<div id="rep-list" style="margin-top:10px;display:none">' + doc.reporte.map((x,j) => '<button class="d-it" data-r="'+j+'">'+(/\.pdf$/i.test(x.nombre) ? "📄" : /\.(xlsx?|csv)$/i.test(x.nombre) ? "📊" : "📝")+' <span>'+esc(x.nombre)+'</span><small>'+(x.tam >= 1048576 ? (x.tam/1048576).toFixed(1)+" MB" : Math.max(1, Math.round((x.tam||0)/1024))+" KB")+'</small></button>').join("") + '</div></div>';
  }
  if(!doc.anulado) html += '<p class="note">Si los datos mostrados no coinciden con el documento que tiene en mano, no lo considere válido y contáctenos.</p>';
  cont.innerHTML = html;
  cont.querySelectorAll(".fotos a").forEach(a => a.onclick = () => abrirGaleria(doc, k, Number(a.dataset.f), Number(a.dataset.i)));
  cont.querySelectorAll(".d-it[data-f]").forEach(b => b.onclick = () => abrirAnexo(k, doc.docs.find(f => f.fila===Number(b.dataset.f)).archivos[Number(b.dataset.j)], b));
  cont.querySelectorAll(".d-it[data-r]").forEach(b => b.onclick = () => abrirAnexo(k, doc.reporte[Number(b.dataset.r)], b));
  const rl = document.getElementById("rep-link");
  if(rl) rl.onclick = () => { const L = document.getElementById("rep-list"); if(doc.reporte.length === 1){ L.style.display = ""; abrirAnexo(k, doc.reporte[0], L.querySelector(".d-it")); } else L.style.display = L.style.display ? "" : "none"; };
  const qp = new URLSearchParams(location.search);
  if(qp.get("d") && doc.docs && !doc.anulado){   // enlace «Documentos anexos» del PDF: lleva a los archivos de esa fila
    const fl = cont.querySelector('#docs .f-fila[data-fila="'+Number(qp.get("f"))+'"]') || cont.querySelector("#docs");
    if(fl){ fl.classList.add("marca"); setTimeout(() => fl.scrollIntoView({behavior:"smooth", block:"center"}), 300); }
  }
  if(qp.get("f") && !qp.get("d") && doc.fotos && !doc.anulado) abrirGaleria(doc, k, Number(qp.get("f")), Number(qp.get("i")||1), true);
  if(doc.pdf && !doc.anulado){
    let url=null;
    const obtener = async () => {
      if(url) return url;
      const buf = new Uint8Array(await (await fetch("data/"+k.id+".pdf.bin")).arrayBuffer());
      const pdf = await descifrar(k.key, buf.slice(0,12), buf.slice(12));
      return url = URL.createObjectURL(new Blob([pdf], {type:"application/pdf"}));
    };
    const win = () => window.open("", "_blank");
    document.getElementById("abrir").onclick = async () => { const w = win(); const u = await obtener(); if(w) w.location = u; else location.href = u; };
    document.getElementById("bajar").onclick = async () => { const a=document.createElement("a"); a.href=await obtener(); a.download=doc.numero+".pdf"; a.click(); };
  }
}

/* documentos anexos: se descifran aquí; el PDF se abre, Word y Excel se descargan */
async function abrirAnexo(k, x, btn){
  const sm = btn.querySelector("small"), antes = sm.textContent; sm.textContent = "Abriendo…";
  const w = /pdf/.test(x.tipo) ? window.open("", "_blank") : null;
  try{
    const r = await fetch("data/"+k.id+"-"+x.id+".bin"); if(!r.ok) throw new Error("no encontrado");
    const buf = new Uint8Array(await r.arrayBuffer());
    const u = URL.createObjectURL(new Blob([await descifrar(k.key, buf.slice(0,12), buf.slice(12))], {type:x.tipo}));
    if(w){ w.location = u; }
    else { const a = document.createElement("a"); a.href = u; a.download = x.nombre; document.body.appendChild(a); a.click(); a.remove(); }
    sm.textContent = antes;
  }catch(e){ if(w) w.close(); sm.textContent = "No se pudo abrir"; }
}
/* carrusel de fotos (se abre desde los enlaces img01, img02… del PDF o de esta página) */
const FOTOS = {};
async function foto(k, id){
  if(FOTOS[id]) return FOTOS[id];
  const r = await fetch("data/"+k.id+"-"+id+".bin"); if(!r.ok) throw new Error("no encontrada");
  const buf = new Uint8Array(await r.arrayBuffer());
  return FOTOS[id] = URL.createObjectURL(new Blob([await descifrar(k.key, buf.slice(0,12), buf.slice(12))], {type:"image/jpeg"}));
}
function abrirGaleria(doc, k, fila, i, desdeEnlace){
  const f = doc.fotos.find(x => x.fila===fila) || doc.fotos[0]; if(!f) return;
  let pos = Math.min(Math.max(1, i||1), f.ids.length) - 1;
  const g = document.getElementById("galeria"), img = document.getElementById("g-img"), carga = document.getElementById("g-carga");
  document.getElementById("g-sub").textContent = doc.tipo + " " + doc.numero + " · " + (f.etq || ("Fila " + f.fila)) + (f.desc ? " · " + f.desc : "");
  const min = document.getElementById("g-min");
  min.innerHTML = f.ids.map((id,j) => '<img data-j="'+j+'" alt="img'+String(j+1).padStart(2,"0")+'">').join("");
  min.querySelectorAll("img").forEach(m => { m.onclick = () => ir(Number(m.dataset.j)); foto(k, f.ids[Number(m.dataset.j)]).then(u => m.src = u).catch(() => {}); });
  async function ir(j){
    pos = (j + f.ids.length) % f.ids.length; img.style.opacity = 0; carga.textContent = "Cargando foto…"; carga.style.display = "";
    document.getElementById("g-cont").textContent = "img" + String(pos+1).padStart(2,"0") + " · " + (pos+1) + " de " + f.ids.length;
    min.querySelectorAll("img").forEach((m,x) => m.classList.toggle("on", x===pos));
    try{ const u = await foto(k, f.ids[pos]); img.src = u; await img.decode().catch(()=>{}); img.style.opacity = 1; carga.style.display = "none";
      const a = document.getElementById("g-bajar"); a.href = u; a.download = doc.numero + "_fila" + f.fila + "_img" + String(pos+1).padStart(2,"0") + ".jpg"; }
    catch(e){ carga.textContent = "No se pudo cargar esta foto."; }
  }
  const una = f.ids.length < 2; document.getElementById("g-prev").style.display = document.getElementById("g-next").style.display = una ? "none" : "";
  document.getElementById("g-prev").onclick = () => ir(pos-1); document.getElementById("g-next").onclick = () => ir(pos+1);
  document.getElementById("g-cerrar").onclick = () => { g.classList.add("hidden"); document.body.style.overflow = ""; if(desdeEnlace) history.replaceState(null, "", "?c=" + encodeURIComponent(codigo)); };
  document.onkeydown = e => { if(g.classList.contains("hidden")) return; if(e.key==="ArrowLeft") ir(pos-1); if(e.key==="ArrowRight") ir(pos+1); if(e.key==="Escape") document.getElementById("g-cerrar").click(); };
  let x0 = null; const v = document.getElementById("g-vista");
  v.ontouchstart = e => x0 = e.touches[0].clientX; v.ontouchend = e => { if(x0==null) return; const dx = e.changedTouches[0].clientX - x0; if(Math.abs(dx) > 40) ir(pos + (dx < 0 ? 1 : -1)); x0 = null; };
  g.classList.remove("hidden"); document.body.style.overflow = "hidden"; ir(pos);
}

(async () => {
  if(!codigo) return noEncontrado();
  setEstado("p-time", ICON_WARN, "Verificando…");
  try{
    const k = await claves(codigo);
    const r = await fetch("data/"+k.id+".json", {cache:"no-store"});
    if(!r.ok) return noEncontrado();
    const e = await r.json();
    const doc = JSON.parse(new TextDecoder().decode(await descifrar(k.key, b64(e.iv), b64(e.ct))));
    mostrar(doc, k);
  }catch(err){ noEncontrado(); }
})();
</script>
</body>
</html>
